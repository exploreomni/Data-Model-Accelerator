name: Accelerator validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_guided_delivery_demo.py --output "$RUNNER_TEMP/guided-delivery"
      - run: python skills/data-model-accelerator/scripts/delivery_portal.py verify "$RUNNER_TEMP/guided-delivery/engineer-example.zip"
      - name: Build the first-use model review handoff
        run: python skills/data-model-accelerator/scripts/run_model_review_demo.py --output "$RUNNER_TEMP/model-review"
      - run: python skills/data-model-accelerator/scripts/delivery_portal.py check-page "$RUNNER_TEMP/model-review/commerce-model-review.zip" --javascript
      - name: Check every offline portal script
        run: python skills/data-model-accelerator/scripts/delivery_portal.py check-page "$RUNNER_TEMP/guided-delivery/engineer-example.zip" --javascript
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/hex.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_looker_omni_e2e.py --output "$RUNNER_TEMP/looker-e2e"
      - run: python skills/data-model-accelerator/scripts/run_hex_omni_e2e.py --output "$RUNNER_TEMP/hex-e2e"
      - name: Reproduce the synthetic Omni operator workflows
        run: python tests/run_omni_operator.py --repo . --output "$RUNNER_TEMP/omni-modeler-pilots"
  deployment-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/deployment.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_deployment*.py' -v
      - name: Signed delivery and exact-byte release gates
        run: python -m unittest discover -s tests -p 'test_delivery_release*.py' -v
      - name: Access policy and persona contracts
        run: python -m unittest discover -s tests -p 'test_security_contract*.py' -v
  source-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/source-adapters.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - name: Exercise every source adapter and coordinator handoff
        run: python -m unittest discover -s tests -p 'test_source_*.py' -v
      - name: Preserve existing specialist workflows
        run: python -m unittest discover -s tests -p 'test_specialist*.py' -v
      - name: Verify bounded specialist context and disclosure
        run: python -m unittest discover -s tests -p 'test_agent_context.py' -v
  lint-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/lint.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_lint*.py' -v
      - run: python -m unittest discover -s tests -p 'test_release_quality.py' -v
      - run: python -m unittest discover -s tests -p 'test_platform_matrix.py' -v
      - name: Authoring provenance, conformance and protected promotion
        run: python -m unittest discover -s tests -p 'test_authoring*.py' -v
      - name: Context observations and controlled comparison
        run: python -m unittest discover -s tests -p 'test_agent*.py' -v
  metadata-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/development.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_data_dictionary_v2.py' -v
      - run: python -m unittest discover -s tests -p 'test_generate_dbt_docs_yml.py' -v
      - run: python -m unittest discover -s tests -p 'test_metadata*.py' -v
      - run: python -m unittest discover -s tests -p 'test_warehouse_metadata*.py' -v
      - run: python -m unittest discover -s tests -p 'test_deployment_metadata_adapter.py' -v
