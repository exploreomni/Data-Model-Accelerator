name: Accelerator validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_guided_delivery_demo.py --output "$RUNNER_TEMP/guided-delivery"
      - run: python skills/data-model-accelerator/scripts/delivery_portal.py verify "$RUNNER_TEMP/guided-delivery/engineer-example.zip"
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/data-model-accelerator/scripts/requirements-hex-e2e.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_looker_omni_e2e.py --output "$RUNNER_TEMP/looker-e2e"
      - run: python skills/data-model-accelerator/scripts/run_hex_omni_e2e.py --output "$RUNNER_TEMP/hex-e2e"
      - name: Reproduce the synthetic Omni operator workflows
        run: python tests/run_omni_operator.py --repo . --output "$RUNNER_TEMP/omni-modeler-pilots"
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/data-model-accelerator/scripts/requirements-deployment.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_deployment*.py' -v
      - name: Signed delivery and exact-byte release gates
        run: python -m unittest discover -s tests -p 'test_delivery_release*.py' -v
      - name: Access policy and persona contracts
        run: python -m unittest discover -s tests -p 'test_security_contract*.py' -v
  lint-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/data-model-accelerator/scripts/requirements-lint.txt -r skills/data-model-accelerator/scripts/requirements-deployment.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_lint*.py' -v
      - run: python -m unittest discover -s tests -p 'test_release_quality.py' -v
      - run: python -m unittest discover -s tests -p 'test_platform_matrix.py' -v
  metadata-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -p 'test_data_dictionary_v2.py' -v
      - run: python -m unittest discover -s tests -p 'test_generate_dbt_docs_yml.py' -v
      - run: python -m unittest discover -s tests -p 'test_metadata*.py' -v
      - run: python -m unittest discover -s tests -p 'test_warehouse_metadata*.py' -v
      - run: python -m unittest discover -s tests -p 'test_deployment_metadata_adapter.py' -v
