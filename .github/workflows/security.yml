name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/security.txt
      - name: Verify advisory coverage cannot silently skip dependencies
        run: python -m unittest discover -s .github/scripts -p 'test_security_helpers.py' -v
      - name: Audit bootstrap, tools and the complete development lock
        run: |
          python .github/scripts/audit_locks.py bootstrap security development hex deployment source-adapters lint tableau powerbi
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Patch and verify the runner baseline
        run: bash .github/scripts/prepare_runner.sh
      - name: Install verified Gitleaks release
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and nested example archives
        run: >-
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml
          --redact --ignore-gitleaks-allow --max-archive-depth 5 --no-banner
  dbt-runtime-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        requirements: [dbt-v2, dbt-oss, dbt-metadata]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/security.txt
      - name: Audit the complete isolated runtime lock
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: python .github/scripts/audit_locks.py "$REQUIREMENTS"
