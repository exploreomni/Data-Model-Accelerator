name: Tableau migration validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tableau:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/tableau.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_tableau_omni_e2e.py --output "$RUNNER_TEMP/tableau-e2e"
