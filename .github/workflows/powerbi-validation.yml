name: Power BI migration validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  powerbi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/data-model-accelerator/scripts/requirements-powerbi-e2e.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_powerbi_omni_e2e.py --output "$RUNNER_TEMP/powerbi-e2e"
