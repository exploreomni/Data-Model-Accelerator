name: Power BI migration validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  powerbi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare verified CI runtime
        uses: ./.github/actions/setup-ci
        with:
          requirements: .github/requirements/powerbi.txt
      - run: python skills/data-model-accelerator/scripts/bootstrap_hex_schema.py
      - run: python -m unittest discover -s tests -v
      - run: python skills/data-model-accelerator/scripts/run_powerbi_omni_e2e.py --output "$RUNNER_TEMP/powerbi-e2e"
