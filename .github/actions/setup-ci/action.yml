name: Prepare isolated CI runtime
description: Patch the supported runner baseline and install verified, locked Python dependencies.
inputs:
  requirements:
    description: Hash-locked requirement file, relative to the checkout; empty for core-only tests.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Patch and verify the runner baseline
      shell: bash
      run: bash .github/scripts/prepare_runner.sh
    - name: Select supported Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Verify dependency locks match their inputs
      shell: bash
      run: python .github/scripts/update_locks.py --check
    - name: Install the reviewed package installer
      shell: bash
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/bootstrap.txt
    - name: Install the selected locked environment
      if: inputs.requirements != ''
      shell: bash
      env:
        CI_REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r "$CI_REQUIREMENTS"
        python -m pip check
