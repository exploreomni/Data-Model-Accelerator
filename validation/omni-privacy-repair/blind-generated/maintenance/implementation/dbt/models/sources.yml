version: 2
sources:
- name: raw_maintenance
  database: SYNTHETIC_REVIEW
  schema: RAW_MAINTENANCE
  description: Planned synthetic raw landing namespace; operator must bind/load supplied
    CSV snapshots explicitly.
  tables:
  - name: work_orders
    identifier: WORK_ORDERS
    columns:
    - name: WORK_ORDER_ID
      description: 'Proposed: Work order identifier in the synthetic snapshot.'
    - name: TENANT_ID
      description: 'Proposed: Tenant identifier retained for downstream filtering;
        no security policy is established.'
    - name: OPENED_ON
      description: 'Proposed: Work order opening date; dashboard date interpretation
        is UTC.'
    - name: LABOR_COST
      description: 'Proposed: Labor contribution to work cost; currency is unspecified.'
    - name: STATUS
      description: 'Proposed: Work order status retained without upstream filtering.'
  - name: parts
    identifier: PARTS
    columns:
    - name: PART_LINE_ID
      description: 'Proposed: Part line identifier in the supplied snapshot.'
    - name: WORK_ORDER_ID
      description: 'Proposed: Work order identifier in the synthetic snapshot.'
    - name: QUANTITY
      description: 'Proposed: Quantity of the part on this line.'
    - name: UNIT_COST
      description: 'Proposed: Cost per part unit; currency is unspecified.'
