version: 2
models:
- name: bronze_readings
  description: 'Proposed synthetic model. Grain: One row per reading_id in the supplied
    snapshot; no historical uniqueness asserted'
  columns:
  - name: reading_id
    description: 'Proposed: Reading identifier in the supplied snapshot.'
  - name: meter_id
    description: 'Proposed: Meter identifier used for the unique meter lookup.'
  - name: recorded_on
    description: 'Proposed: Reading date retained for interactive UTC date filtering.'
  - name: kwh
    description: 'Proposed: Energy usage in kilowatt-hours; additive across selected
      readings.'
- name: bronze_meters
  description: 'Proposed synthetic model. Grain: One row per meter_id in the supplied
    snapshot; no historical uniqueness asserted'
  columns:
  - name: meter_id
    description: 'Proposed: Meter identifier used for the unique meter lookup.'
  - name: zone
    description: 'Proposed: Meter zone retained for interactive filtering.'
