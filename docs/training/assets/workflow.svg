<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
  <title id="title">One domain, from question to reviewed candidate</title>
  <desc id="desc">You set the goal. The coordinator scopes and saves the work. Design specialists propose tables. You review and request changes. Implementation, Omni and review specialists prepare selected files and evidence. Your team validates before separately authorizing release. Provisional code can be requested before design approval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#75819a"/></marker>
  </defs>
  <rect width="1080" height="900" rx="24" fill="#f5f6fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#19243c">
    <text x="40" y="54" font-size="32" font-weight="700">One domain. One reviewable path.</text>
    <text x="40" y="90" font-size="22" fill="#43516b">You supply meaning. The agent organizes the work. Your team verifies it.</text>
    <g stroke="#75819a" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 80 214 V 236"/><path d="M 80 326 V 348"/>
      <path d="M 80 438 V 460"/><path d="M 80 550 V 572"/><path d="M 80 662 V 684"/>
    </g>
    <rect x="40" y="126" width="1000" height="88" rx="14" fill="#eee8fc"/>
    <circle cx="80" cy="170" r="23" fill="#6841a5"/><text x="80" y="178" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <text x="124" y="160" font-size="18" font-weight="700" fill="#6841a5">YOU</text>
    <text x="124" y="191" font-size="24" font-weight="700">Set the outcome</text>
    <text x="445" y="161" font-size="22">Bring one business question and approved inputs.</text>
    <text x="445" y="191" font-size="22">Choose the domain to work on first.</text>

    <rect x="40" y="238" width="1000" height="88" rx="14" fill="#e5edf9"/>
    <circle cx="80" cy="282" r="23" fill="#2f5794"/><text x="80" y="290" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="124" y="272" font-size="18" font-weight="700" fill="#2f5794">COORDINATOR</text>
    <text x="124" y="303" font-size="24" font-weight="700">Scope and organize</text>
    <text x="445" y="273" font-size="22">Inventory evidence, ask missing questions, save progress.</text>
    <text x="445" y="303" font-size="22">Give specialists only the relevant task and sources.</text>

    <rect x="40" y="350" width="1000" height="88" rx="14" fill="#dff1ee"/>
    <circle cx="80" cy="394" r="23" fill="#146c61"/><text x="80" y="402" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <text x="124" y="384" font-size="18" font-weight="700" fill="#146c61">DESIGN SPECIALISTS</text>
    <text x="124" y="415" font-size="24" font-weight="700">Propose the model</text>
    <text x="445" y="385" font-size="22">Tables, meanings, relationships and old-to-new mappings.</text>
    <text x="445" y="415" font-size="22">Show evidence, reuse opportunities and open questions.</text>

    <rect x="40" y="462" width="1000" height="88" rx="14" fill="#eee8fc"/>
    <circle cx="80" cy="506" r="23" fill="#6841a5"/><text x="80" y="514" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="124" y="496" font-size="18" font-weight="700" fill="#6841a5">YOU + BUSINESS REVIEWER</text>
    <text x="124" y="527" font-size="24" font-weight="700">Review and correct</text>
    <text x="445" y="497" font-size="22">Inspect the design in START_HERE.html.</text>
    <text x="445" y="527" font-size="22">Request changes; approve the exact scope when ready.</text>

    <rect x="40" y="574" width="1000" height="88" rx="14" fill="#dff1ee"/>
    <circle cx="80" cy="618" r="23" fill="#146c61"/><text x="80" y="626" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">5</text>
    <text x="124" y="608" font-size="18" font-weight="700" fill="#146c61">CODE, OMNI + REVIEW ROLES</text>
    <text x="124" y="639" font-size="24" font-weight="700">Build selected outputs</text>
    <text x="445" y="609" font-size="22">Prepare warehouse code and Omni files when selected.</text>
    <text x="445" y="639" font-size="22">Check supported behavior; retain unresolved findings.</text>

    <rect x="40" y="686" width="1000" height="88" rx="14" fill="#eee8fc"/>
    <circle cx="80" cy="730" r="23" fill="#6841a5"/><text x="80" y="738" font-size="23" text-anchor="middle" fill="#fff" font-weight="700">6</text>
    <text x="124" y="720" font-size="18" font-weight="700" fill="#6841a5">YOUR DELIVERY TEAM</text>
    <text x="124" y="751" font-size="24" font-weight="700">Verify, then authorize</text>
    <text x="445" y="721" font-size="22">Check real data, definitions and access.</text>
    <text x="445" y="751" font-size="22">Authorize deployment separately; choose next domain.</text>

    <text x="40" y="824" font-size="21" font-weight="700">Need code before every answer is known?</text>
    <text x="40" y="857" font-size="21" fill="#43516b">Request provisional files. Assumptions stay visible; production approval stays separate.</text>
  </g>
</svg>
