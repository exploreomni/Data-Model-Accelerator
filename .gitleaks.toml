title = "Data Model Accelerator secret scanning"

[extend]
useDefault = true

# These three values are recorded SHA-256 digests of synthetic SQL artifacts,
# not credentials. Match the exact field AND exact reviewed digest; neither
# entire files nor arbitrary 64-character strings are excluded.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed synthetic SQL-file checksum assignments"
regexTarget = "match"
regexes = [
  '''^adjustment_key_unique\.sql":\s*"(?:8acc551d6f36f57efa14238054ab2b70096bbf42c5b1c96bd635a92462134937|e9a819edbae2c495bcf56e16467ab22575fa8c6e5818c60449341403cac4337d)"$''',
  '''^bronze_lexical_keys\.sql":\s*"28153b9d6125e34640e376ed5a49a3ab5c7ccf7927583516eb81b0a0b74b9171"$''',
]
