- cellId: 29a72b7c-da5a-5c86-a258-b20fd59e0ef1
  cellType: SQL
  cellLabel: Monthly summary
  config:
    source: "SELECT DATE_TRUNC('month', INVOICE_DATE) AS month, SEGMENT AS segment,\n       SUM(NET_CENTS) AS net_cents, SUM(PAID_CENTS) AS paid_cents,\n       SUM(PAID_CENTS) / NULLIF(SUM(NET_CENTS), 0) AS payment_rate,\n       COUNT(DISTINCT CASE WHEN NET_CENTS > 0 THEN CUSTOMER_ID END) AS invoiced_active_customers,\n       COUNT(DISTINCT CASE WHEN PAID_CENTS > 0 THEN CUSTOMER_ID END) AS active_customers\nFROM enriched WHERE STATUS = 'posted'\n  AND TENANT_ID = {{ tenant }}\n  AND INVOICE_DATE >= CAST({{ start_date }} AS DATE)\n  AND INVOICE_DATE < CAST({{ end_date }} AS DATE)\n  AND ({{ segment }} = 'ALL' OR SEGMENT = {{ segment }})\nGROUP BY MONTH, SEGMENT ORDER BY MONTH, SEGMENT"
    resultVariableName: executive_summary
    dataFrameCell: true
    dataConnectionId: null
    castDecimals: false
    sqlCellOutputType: PANDAS
- cellId: c6af3404-a645-57e7-819f-29af7f1ae8cc
