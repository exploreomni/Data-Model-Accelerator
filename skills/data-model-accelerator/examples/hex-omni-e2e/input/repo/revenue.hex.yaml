- cellId: 384c83ea-bf87-57bc-bac0-dd8a11c532b0
  cellType: COMPONENT_IMPORT
  cellLabel: Revenue definition
  config:
    component:
      id: 8c7958a3-573b-5b81-9a0e-02de54bed99d
      version: 48181ff3-ae9a-5717-add9-699e64214924
- cellId: c7db64be-6671-54f8-8714-2d80116373e6
  cellType: SQL
  cellLabel: Monthly summary
  config:
    source: "SELECT DATE_TRUNC('month', INVOICE_DATE) AS month, SEGMENT AS segment,\n       COUNT(*) AS invoice_count,\n       SUM(NET_CENTS) AS net_cents, SUM(PAID_CENTS) AS paid_cents,\n       SUM(OUTSTANDING_CENTS) AS outstanding_cents,\n       SUM(PAID_CENTS) / NULLIF(SUM(NET_CENTS), 0) AS payment_rate\nFROM enriched WHERE STATUS = 'posted'\n  AND TENANT_ID = {{ tenant }}\n  AND INVOICE_DATE >= CAST({{ start_date }} AS DATE)\n  AND INVOICE_DATE < CAST({{ end_date }} AS DATE)\n  AND ({{ segment }} = 'ALL' OR SEGMENT = {{ segment }})\nGROUP BY MONTH, SEGMENT ORDER BY MONTH, SEGMENT"
    resultVariableName: revenue_summary
    dataFrameCell: true
    dataConnectionId: null
    castDecimals: false
    sqlCellOutputType: PANDAS
- cellId: a95d09a8-d68c-5a5a-ab15-578125b63aa6
  cellType: INPUT
  cellLabel: What-if multiplier
  config:
    name: what_if_multiplier
    outputType: NUMBER
    inputType: NUMERIC_INPUT
    defaultValue: 1.1
    options:
      increment: 0.1
- cellId: be08e4a3-6cd9-553d-bd90-4f20808feb5c
  cellType: CODE
  cellLabel: Exploratory revenue forecast
  config:
    source: 'what_if_revenue = revenue_summary["net_cents"] * what_if_multiplier

      '
