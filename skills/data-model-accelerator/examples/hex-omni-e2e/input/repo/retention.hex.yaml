- cellId: 06a5206d-c15a-5f3d-b2ad-9116c2f34f33
  cellType: SQL
  cellLabel: Active customers
  config:
    source: "WITH first_paid AS (\n  SELECT TENANT_ID, CUSTOMER_ID, MIN(DATE_TRUNC('month', INVOICE_DATE)) AS FIRST_PAID_MONTH\n  FROM enriched WHERE STATUS = 'posted' AND PAID_CENTS > 0 GROUP BY TENANT_ID, CUSTOMER_ID\n)\nSELECT DISTINCT e.TENANT_ID AS tenant_id, e.CUSTOMER_ID AS customer_id,\n       DATE_TRUNC('month', e.INVOICE_DATE) AS month, e.SEGMENT AS segment,\n       f.FIRST_PAID_MONTH AS first_paid_month\nFROM enriched e LEFT JOIN first_paid f ON e.TENANT_ID = f.TENANT_ID AND e.CUSTOMER_ID = f.CUSTOMER_ID WHERE STATUS = 'posted'\n  AND e.TENANT_ID = {{ tenant }}\n  AND INVOICE_DATE >= CAST({{ start_date }} AS DATE)\n  AND INVOICE_DATE < CAST({{ end_date }} AS DATE)\n  AND ({{ segment }} = 'ALL' OR SEGMENT = {{ segment }}) AND NET_CENTS > 0"
    resultVariableName: active_customer_detail
    dataFrameCell: true
    dataConnectionId: null
    castDecimals: false
    sqlCellOutputType: PANDAS
- cellId: 8473ffd1-e376-5d15-b81f-689c9fa7a4b1
  cellType: SQL
  cellLabel: Monthly summary
  config:
    source: 'SELECT month, segment, COUNT(DISTINCT CUSTOMER_ID) AS active_customers

      FROM active_customer_detail GROUP BY MONTH, SEGMENT ORDER BY MONTH, SEGMENT'
    resultVariableName: retention_summary
    dataFrameCell: true
    dataConnectionId: null
    castDecimals: false
    sqlCellOutputType: PANDAS
